name: FastXlsxNativeBindings
description: Native bindings for the fast_xlsx Rust cdylib.
output: lib/src/fast_xlsx_bindings.g.dart
headers:
  entry-points:
    - src/fast_xlsx.h
functions:
  include:
    - '^fx_.*'
structs:
  include:
    - '^Fx.*'
enums:
  include:
    - '^Fx.*'
unions:
  include: []
typedefs:
  include:
    - '^Fx.*'
comments: false
sort: true
exclude-all-by-default: true
silence-enum-warning: true
ffi-native:
  asset-id: package:fast_xlsx/src/fast_xlsx_bindings.g.dart
