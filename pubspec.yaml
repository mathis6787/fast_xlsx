name: fast_xlsx
description: Streaming XLSX import and export for Dart backends via Rust FFI.
version: 0.1.0
repository: https://github.com/mathis6787/fast_xlsx
issue_tracker: https://github.com/mathis6787/fast_xlsx/issues

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.11.0

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_rust: ^1.0.4

dev_dependencies:
  args: ^2.7.0
  ffigen: ^22.1.0
  lints: ^6.0.0
  test: ^1.25.6

hooks:
  user_defines:
    fast_xlsx:
      local_build: true
